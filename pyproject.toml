[project]
name = "check-astro-showcase"
version = "0.1.0"
description = "CLI tool to check which page a site appears on in Astro.build Showcase"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bintangazhar" }]
dependencies = [
  "aiohttp>=3.14.5",
  "certifi>=2026.10.23",
]

[project.scripts]
astro-showcase = "check_astro_showcase:main"

[dependency-groups]
dev = ["pyinstaller>=6.0"]

[tool.uv]
package = false
