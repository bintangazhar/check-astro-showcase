name: Build astro-showcase binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: astro-showcase-linux
          - os: macos-latest
            artifact: astro-showcase-macos
          - os: windows-latest
            artifact: astro-showcase-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Build binary
        run: |
          uv run pyinstaller --onefile --name ${{ matrix.artifact }} --hidden-import=certifi check_astro_showcase.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/astro-showcase-linux/astro-showcase-linux
            artifacts/astro-showcase-macos/astro-showcase-macos
            artifacts/astro-showcase-windows.exe/astro-showcase-windows.exe
          generate_release_notes: true